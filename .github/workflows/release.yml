name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.build.outputs.version }}
      zip_name: ${{ steps.build.outputs.zip_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The repository checks read the whole history, so a shallow clone
          # would verify only the tip commit.
          fetch-depth: 0

      - name: Install build and analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip shellcheck
          curl -fsSL --retry 3 -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Run repository checks
        run: bash scripts/checks.sh

      # The functional suites run before anything is built, so a release cannot
      # be published from a tree that fails them.
      # The installer requires root by design, so the suites run as an operator
      # would run them.
      - name: Install into a disposable prefix and drive the documented commands
        run: sudo bash scripts/verify-install.sh

      - name: Drive the documented commands against local service doubles
        run: sudo bash scripts/integration-test.sh

      - name: Import the signing key when one is configured
        id: signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ]; then
            printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
            key_id="$(gpg --list-keys --with-colons | awk -F: '/^pub:/ {print $5; exit}')"
            echo "key_id=$key_id" >> "$GITHUB_OUTPUT"
            echo "signing=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signing=no" >> "$GITHUB_OUTPUT"
            echo "No signing key is configured. The release is published with SHA-256 checksums only."
          fi

      - name: Build the release archive
        id: build
        run: |
          if [ "${{ steps.signing.outputs.signing }}" = "yes" ]; then
            bash scripts/build-release.sh --gpg-key "${{ steps.signing.outputs.key_id }}"
          else
            bash scripts/build-release.sh
          fi
          version="$(tr -d '[:space:]' <VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_name=BaToHub-${version}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify the archive against the manifest and the checksum sidecar
        run: |
          archive="${{ steps.build.outputs.zip_name }}"
          bash scripts/build-release.sh --verify-archive "$archive"
          sha256sum -c "${archive}.sha256"
          if [ -f manifest.json.asc ]; then
            gpg --batch --no-tty --verify manifest.json.asc manifest.json
          fi

      - name: Upload the release archive as a build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-archive
          path: |
            BaToHub-*.zip
            BaToHub-*.zip.sha256
            manifest.json
            manifest.json.asc
          if-no-files-found: error

  container-verify-ubuntu:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run installation verification in a clean Ubuntu 22.04 userland
        run: sudo bash scripts/container-verify.sh ubuntu:22.04 | tee container-verify-ubuntu-2204.log

      - name: Upload the verification log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verify-ubuntu-2204
          path: container-verify-ubuntu-2204.log
          if-no-files-found: error

  container-verify-debian:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run installation verification in a clean Debian 12 userland
        run: sudo bash scripts/container-verify.sh debian:12 | tee container-verify-debian-12.log

      - name: Upload the verification log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verify-debian-12
          path: container-verify-debian-12.log
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release, container-verify-ubuntu, container-verify-debian]
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the built release archive
        uses: actions/download-artifact@v4
        with:
          name: release-archive

      # The asset list and the release body are resolved from the files that
      # were actually produced, so a signature is never advertised when none was
      # made and an absent asset cannot be listed.
      - name: Assemble the release assets
        id: assets
        run: |
          version="${{ needs.release.outputs.version }}"
          mkdir -p release-assets
          cp "BaToHub-${version}.zip" "BaToHub-${version}.zip.sha256" manifest.json release-assets/
          signed=no
          if [ -f manifest.json.asc ]; then
            signed=yes
            cp manifest.json.asc release-assets/
          fi
          bash scripts/release-body.sh --signed "$signed" > release-body.md
          files="release-assets/BaToHub-${version}.zip
          release-assets/BaToHub-${version}.zip.sha256
          release-assets/manifest.json"
          if [ "$signed" = "yes" ]; then
            files="${files}
          release-assets/manifest.json.asc"
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "signing=${signed}" >> "$GITHUB_OUTPUT"
          cat release-body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # The installer and the self-update resolve the newest published
          # release through the GitHub API, which ignores pre-releases, so a
          # tagged release is published as a normal release and marked latest.
          body_path: release-body.md
          prerelease: false
          make_latest: true
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
          generate_release_notes: false

  # Publication is followed by an installation from the published assets in a
  # clean userland. This is the path the documented one-liner takes, so a defect
  # in it is reported by the workflow that published the release.
  verify-published-release:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the published release in a clean Ubuntu 22.04 userland
        run: |
          sudo BATOHUB_VERIFY_SOURCE=release BATOHUB_RELEASE_TAG="$GITHUB_REF_NAME" \
            bash scripts/container-verify.sh ubuntu:22.04 | tee verify-published-release.log

      - name: Upload the verification log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-published-release
          path: verify-published-release.log
          if-no-files-found: error
