name: BaToHub checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in install.sh bin/batohub bin/uninstall lib/common.sh core/license.sh core/main.sh core/update.sh security/integrity.sh modules/rebecca/rebecca_core.sh modules/rebecca/ssl/module.sh modules/rebecca/templates/module.sh; do
            test -f "$f" || continue
            bash -n "$f" || { echo "FAILED: $f"; exit 1; }
          done
          echo "Shell syntax OK"
      - name: Manifest validity
        run: |
          command -v python3 >/dev/null 2>&1 || exit 0
          python3 - <<'PY'
          import json, sys
          try:
              with open("manifest.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              for key in ("version", "package", "sha256"):
                  if key not in data:
                      print(f"manifest.json missing {key}")
                      sys.exit(1)
          except Exception as e:
              print(e)
              sys.exit(1)
          print("manifest.json OK")
          PY
