name: BaToHub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck shfmt

      - name: Shell syntax
        run: |
          for f in $(find . -type f -name '*.sh'); do
            if ! bash -n "$f"; then
              echo "FAILED: $f"
              exit 1
            fi
          done
          echo "Shell syntax OK"

      - name: Shellcheck
        run: |
          for f in $(find . -type f -name '*.sh'); do
            shellcheck "$f" || exit 1
          done
          echo "Shellcheck OK"

      - name: Format check
        run: |
          if ! shfmt -d .; then
            echo "Formatting issues found"
            exit 1
          fi
          echo "Format OK"
