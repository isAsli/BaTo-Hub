# BaToHub configuration.
#
# The installer copies this file to /etc/batohub/batohub.conf with mode 0600 the
# first time it runs. Later runs never overwrite it. Every key is read by
# lib/common.sh and can be edited from the Settings menu.

# Project name shown in the interface.
APP_NAME="BaToHub"

# Version of this release. It must match the VERSION file.
APP_VERSION="0.0.3"

# Installation directory that holds bin, core, lib, panels, tools and security.
INSTALL_DIR="/opt/batohub"

# Directory for configuration and the integrity manifest.
CONFIG_DIR="/etc/batohub"

# Directory for state, locks and backups.
STATE_DIR="/var/lib/batohub"

# Directory for logs.
LOG_DIR="/var/log/batohub"

# Directory that holds backup archives.
BACKUP_DIR="/var/lib/batohub/backups"

# Number of backup archives to keep before the oldest ones are removed.
BACKUP_KEEP="5"

# GitHub repository and branch used by the self-update feature.
GITHUB_REPO="isAsli/BaTo-Hub"
GITHUB_BRANCH="main"

# Path of the global command installed by the installer.
GLOBAL_CMD_NAME="/usr/local/bin/BaToHub"

# Space separated list of paths the operator owns. The self-update never
# replaces or deletes anything under these paths.
USER_MANAGED_PATHS=""
