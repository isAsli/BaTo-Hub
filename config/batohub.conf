# BaToHub configuration.
#
# The installer copies this file to /etc/batohub/batohub.conf with mode 0600 the
# first time it runs. Later runs never overwrite it. Every key is read by
# lib/common.sh and can be edited from the Settings menu.
#
# Features that hold a credential keep their own file with mode 0600, owner
# root:root, and are managed from the matching menu entry:
#
#   /etc/batohub/nodes.conf          node endpoint and credential overrides
#   /etc/batohub/ssl/<panel>.conf    registered certificate names per panel
#   /etc/batohub/ssl/dns.conf        DNS provider variables for DNS-01
#   /etc/batohub/telegram.conf       backup delivery token and chat
#   /etc/batohub/telegram_bot.conf   management bot token and allowed users
#   /etc/batohub/alerts.conf         alert switches, thresholds and delivery
#   /etc/batohub/admins.conf         administrator accounts and roles

# Project name shown in the interface.
APP_NAME="BaToHub"

# Version of this release. It must match the VERSION file.
APP_VERSION="0.0.5"

# Installation directory that holds bin, core, lib, panels, tools and security.
INSTALL_DIR="/opt/batohub"

# Directory for configuration and the integrity manifest.
CONFIG_DIR="/etc/batohub"

# Directory for state, locks and backups.
STATE_DIR="/var/lib/batohub"

# Directory for logs.
LOG_DIR="/var/log/batohub"

# Directory that holds backup archives.
BACKUP_DIR="/var/lib/batohub/backups"

# Number of backup archives to keep before the oldest ones are removed.
BACKUP_KEEP="5"

# GitHub repository and branch used by the self-update feature.
GITHUB_REPO="isAsli/BaTo-Hub"
GITHUB_BRANCH="main"

# Path of the global command installed by the installer.
GLOBAL_CMD_NAME="/usr/local/bin/BaToHub"

# Space separated list of paths the operator owns. The self-update never
# replaces or deletes anything under these paths.
USER_MANAGED_PATHS=""

# 1 makes a failed integrity check refuse to open the interactive interface.
# 0 (the default) reports the mismatch and leaves the operator in control.
INTEGRITY_HARD_FAIL="0"

# Number of report exports kept in the reports directory before the oldest ones
# are removed.
REPORT_KEEP="20"

# Timeout in seconds of one request to a panel API. The Telegram delivery and the
# management bot raise it for an upload through their own settings.
API_TIMEOUT="30"

# Largest upload the Telegram Bot API accepts from BaToHub in one message. A
# larger backup is split into parts that are sent separately.
TELEGRAM_MAX_UPLOAD_BYTES="45000000"
