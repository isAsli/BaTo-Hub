APP_NAME="BaToHub"
APP_VERSION="0.0.2"
GITHUB_REPO="isAsli/BaTo-Hub"
GITHUB_BRANCH="main"
UPDATE_MANIFEST="https://raw.githubusercontent.com/isAsli/BaTo-Hub/main/manifest.json"
INSTALL_DIR="/opt/batohub"
CONFIG_DIR="/etc/batohub"
STATE_DIR="/var/lib/batohub"
LOG_DIR="/var/log/batohub"
STATE_DIR_MODE="750"
BACKUP_DIR="${STATE_DIR}/backups"
BACKUP_KEEP=5
GLOBAL_CMD_NAME="/usr/local/bin/BaToHub"
